{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<form class="card" method="post" action="/login" style="max-width:420px">
  <h2>Представьтесь</h2>
  <p class="small muted">Имя подписывает заметки и смену статусов — команда видит, кто что сделал. Пароль не нужен (демо).</p>
  <input type="hidden" name="next" value="{{ next }}">
  <label>Имя</label><input type="text" name="name" required maxlength="40" placeholder="Анна, закупки СПб">
  <br><br><button class="btn">Войти</button>
</form>
{% endblock %}
